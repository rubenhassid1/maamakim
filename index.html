<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MAAMAKIM — Sovereign Underwater Datacenters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --paper:oklch(0.97 0.005 80);
  --paper-2:oklch(0.94 0.008 80);
  --ink:oklch(0.18 0.02 240);
  --ink-2:oklch(0.32 0.02 240);
  --ink-3:oklch(0.55 0.015 240);
  --rule:oklch(0.85 0.01 240);
  --rule-strong:oklch(0.72 0.015 240);
  --signal:oklch(0.72 0.14 55);
  --signal-deep:oklch(0.55 0.14 50);
  --abyss:oklch(0.14 0.03 240);
  --ok:oklch(0.62 0.10 160);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-ligatures:none}
.serif{font-family:'Instrument Serif',serif;font-weight:400}
.hairline{border-top:1px solid var(--rule)}
.container{max-width:1440px;margin:0 auto;padding:0 40px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:500;font-size:14px;letter-spacing:.01em;cursor:pointer;transition:transform .12s ease, background .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--abyss)}
.btn .arr{width:14px;height:1px;background:currentColor;position:relative}
.btn .arr::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
::selection{background:var(--signal);color:var(--abyss)}

/* placeholder stripe */
.ph{background-image:repeating-linear-gradient(135deg, oklch(0.88 0.01 240) 0 2px, transparent 2px 10px);border:1px solid var(--rule);position:relative}
.ph .ph-label{position:absolute;left:10px;bottom:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);background:var(--paper);padding:2px 6px;border:1px solid var(--rule)}

/* blink */
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.2}}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--signal);animation:blink 1.4s infinite;vertical-align:middle}
.dot.ok{background:var(--ok)}

/* scanning line */
@keyframes sweep{0%{transform:translateY(-100%)}100%{transform:translateY(2000%)}}

/* ============== RESPONSIVE ============== */
/* Tablet */
@media (max-width: 1200px){
  .resp-nav-links{display:none !important}
  .resp-nav-live{display:none !important}
  .resp-mobile-menu-btn{display:flex !important}
}
@media (max-width: 1024px){
  .container{padding:0 28px}
  .resp-hero{grid-template-columns:1fr !important; gap:40px !important; padding-top:40px !important; padding-bottom:48px !important}
  .resp-hero h1{font-size:72px !important}
  .resp-hero-stats{grid-template-columns:repeat(2,1fr) !important}
  .resp-hero-stats > div:nth-child(2){border-right:none !important}
  .resp-thesis-grid{grid-template-columns:1fr !important; gap:40px !important}
  .resp-thesis-cols{grid-template-columns:1fr !important}
  .resp-thesis-cols > div{border-right:none !important; border-bottom:1px solid var(--rule)}
  .resp-arch-grid{grid-template-columns:1fr !important; gap:40px !important}
  .resp-econ-grid{grid-template-columns:1fr !important; gap:32px !important}
  .resp-team-grid{grid-template-columns:repeat(2,1fr) !important}
  .resp-team-grid > div{border-right:1px solid var(--rule) !important}
  .resp-team-grid > div:nth-child(2n){border-right:none !important}
  .resp-round-grid{grid-template-columns:1fr !important; gap:40px !important}
  .resp-round-grid h2{font-size:56px !important}
  .resp-backers{grid-template-columns:repeat(3,1fr) !important}
  .resp-backers > div{border-right:1px solid var(--rule) !important}
  .resp-backers > div:nth-child(3n){border-right:none !important}
  .resp-backers > div:nth-child(n+4){border-top:1px solid var(--rule)}
  .resp-footer{grid-template-columns:repeat(2,1fr) !important; gap:32px !important}
  .resp-timeline{grid-template-columns:64px 48px 1fr !important}
  .resp-timeline-status{grid-column:3/4; text-align:left !important; margin-top:6px}
  .resp-threat{grid-template-columns:1fr 44px 100px !important; row-gap:6px}
  .resp-threat-counter{grid-column:1/-1 !important; order:3}
  .resp-section{padding:64px 28px !important}
}

/* Mobile */
@media (max-width: 640px){
  .container{padding:0 20px}
  html,body{font-size:14.5px}
  .resp-nav-cta{display:none !important}
  .resp-wordmark-sub{display:none}
  .resp-hero{padding-top:32px !important; padding-bottom:40px !important}
  .resp-hero h1{font-size:52px !important; line-height:.96 !important}
  .resp-hero p{font-size:16px !important}
  .resp-hero-btns{flex-direction:column; align-items:stretch}
  .resp-hero-btns a{justify-content:center}
  .resp-hero-stats{grid-template-columns:1fr 1fr !important; margin-top:36px !important}
  .resp-hero-stats > div{padding:14px 12px 14px 0 !important}
  .resp-hero-stats > div div:first-child{font-size:22px !important}
  .resp-telemetry{min-height:0 !important}
  .resp-section{padding:56px 20px !important}
  .resp-section-title{font-size:36px !important}
  .resp-section-num{grid-template-columns:1fr !important; gap:10px !important}
  .resp-section-num > div:first-child{display:none}
  .resp-thesis-big{font-size:18px !important}
  .resp-arch-title{font-size:36px !important}
  .resp-arch-tabs button{font-size:10px !important; padding:10px 4px !important; letter-spacing:.04em !important}
  .resp-threat-head{display:none !important}
  .resp-threat{grid-template-columns:1fr !important; padding:14px 16px !important; row-gap:6px}
  .resp-threat > *{grid-column:1/-1 !important}
  .resp-threat-vector{font-size:15px !important; font-weight:600}
  .resp-threat-counter{font-size:13px !important; color:var(--ink-3) !important}
  .resp-threat-sev{display:inline-flex; align-items:center; gap:8px}
  .resp-team-grid{grid-template-columns:1fr !important}
  .resp-team-grid > div{border-right:none !important; padding-right:0 !important}
  .resp-round-grid h2{font-size:44px !important}
  .resp-round-tbl{font-size:13px !important}
  .resp-round-tbl > div{grid-template-columns:1fr !important; gap:2px !important; padding:12px 16px !important}
  .resp-quote{font-size:22px !important; padding-top:28px !important; margin-top:56px !important}
  .resp-backers{grid-template-columns:repeat(2,1fr) !important}
  .resp-backers > div{border-right:1px solid var(--rule) !important}
  .resp-backers > div:nth-child(2n){border-right:none !important}
  .resp-backers > div:nth-child(n+3){border-top:1px solid var(--rule)}
  .resp-backers > div:nth-child(n+5){border-top:1px solid var(--rule)}
  .resp-footer{grid-template-columns:1fr !important}
  .resp-footer-bar{flex-direction:column; gap:6px; text-align:center}
  .resp-ticker{font-size:10px !important}
  .resp-timeline{grid-template-columns:56px 40px 1fr !important; padding:16px 0 !important}
  .resp-timeline-year{font-size:17px !important}
  .resp-timeline-desc{font-size:14px !important}
  .resp-section-head-h2{font-size:32px !important}
  .resp-tweaks{width:calc(100vw - 24px) !important; right:12px !important; bottom:12px !important}
  .btn{padding:14px 18px; font-size:14px}
  input[type="range"]{width:100% !important}
}

.resp-mobile-menu-btn{display:none}
.resp-mobile-drawer{position:fixed;top:72px;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--ink);z-index:39;padding:16px 20px;display:grid;gap:2px;transform:translateY(-110%);transition:transform .25s ease,visibility 0s linear .25s;visibility:hidden}
.resp-mobile-drawer.open{transform:translateY(0);visibility:visible;transition:transform .25s ease,visibility 0s linear 0s}
.resp-mobile-drawer.open{transform:translateY(0)}
.resp-mobile-drawer a{display:block;padding:14px 4px;border-bottom:1px solid var(--rule);font-size:16px}
.resp-mobile-drawer a:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="root"></div>

<script>
const TWEAK_DEFAULS = /*EDITMODE-BEGIN*/{
  "accent": "#e08a3c",
  "codename": "MAAMAKIM",
  "raise": "$100M",
  "round": "Series A",
  "heroVariant": "map",
  "density": "dense"
}/*EDITMODE-END*/;
</script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo} = React;

/* ============== NAV ============== */
function Nav({state, setState}){
  const [open,setOpen]=useState(false);
  const links=['Thesis','Architecture','Threat Model','Economics','Team','Round'];
  return (
    <header style={{position:'sticky',top:0,zIndex:40,background:'var(--paper)',borderBottom:'1px solid var(--rule)'}}>
      <div className="container" style={{display:'flex',alignItems:'center',justifyContent:'space-between',minHeight:72,gap:12,flexWrap:'nowrap',paddingTop:14,paddingBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:14,minWidth:0}}>
          <Wordmark/>
          <span className="mono resp-nav-live resp-nav-classif" style={{fontSize:11,color:'var(--ink-3)',borderLeft:'1px solid var(--rule)',paddingLeft:14,whiteSpace:'nowrap'}}>CLASSIFICATION · PROJECT BRIEF / INVESTOR</span>
        </div>
        <nav className="resp-nav-links" style={{display:'flex',gap:28,fontSize:13.5}}>
          {links.map(l=>(
            <a key={l} href={'#'+l.toLowerCase().replace(/ /g,'-')} style={{color:'var(--ink-2)'}}>{l}</a>
          ))}
        </nav>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <span className="mono resp-nav-live" style={{fontSize:11,color:'var(--ink-3)'}}><span className="dot"/> LIVE · HAIFA TRENCH TEST POD</span>
          <a className="btn resp-nav-cta" href="#round">Request dataroom <span className="arr"/></a>
          <button className="resp-mobile-menu-btn" onClick={()=>setOpen(!open)} aria-label="Menu" style={{width:40,height:40,border:'1px solid var(--ink)',background:'var(--paper)',cursor:'pointer',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:4,padding:0}}>
            <span style={{width:16,height:1,background:'var(--ink)',transform:open?'translateY(2.5px) rotate(45deg)':'none',transition:'transform .2s'}}/>
            <span style={{width:16,height:1,background:'var(--ink)',transform:open?'translateY(-2.5px) rotate(-45deg)':'none',transition:'transform .2s'}}/>
          </button>
        </div>
      </div>
      <div className={'resp-mobile-drawer '+(open?'open':'')}>
        {links.map(l=>(
          <a key={l} href={'#'+l.toLowerCase().replace(/ /g,'-')} onClick={()=>setOpen(false)}>{l}</a>
        ))}
        <a href="#round" onClick={()=>setOpen(false)} style={{color:'var(--signal-deep)',fontWeight:600}}>Request dataroom →</a>
      </div>
    </header>
  );
}
function Wordmark(){
  return (
    <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
      <svg width="26" height="26" viewBox="0 0 26 26" style={{flexShrink:0}}>
        <rect x="0.5" y="0.5" width="25" height="25" fill="none" stroke="currentColor"/>
        <line x1="0" y1="13" x2="26" y2="13" stroke="currentColor" strokeWidth="1"/>
        <line x1="13" y1="0" x2="13" y2="26" stroke="currentColor" strokeDasharray="2 2"/>
        <circle cx="13" cy="19" r="2.2" fill="var(--signal)"/>
      </svg>
      <div style={{display:'flex',flexDirection:'column',justifyContent:'center',lineHeight:1.1}}>
        <div style={{fontWeight:700,letterSpacing:'.04em',fontSize:14}}>MAAMAKIM</div>
        <div className="mono resp-wordmark-sub" style={{fontSize:9.5,color:'var(--ink-3)',marginTop:2,lineHeight:1}}>מעמקים · THE DEEPS</div>
      </div>
    </div>
  );
}

/* ============== HERO ============== */
function Hero(){
  const [coords, setCoords] = useState({lat:32.8192, lng:34.9402, depth:612});
  useEffect(()=>{
    const id=setInterval(()=>{
      setCoords(c=>({
        lat:+(c.lat + (Math.random()-0.5)*0.0002).toFixed(4),
        lng:+(c.lng + (Math.random()-0.5)*0.0002).toFixed(4),
        depth: Math.round(608 + Math.random()*8)
      }));
    },1200);
    return ()=>clearInterval(id);
  },[]);
  return (
    <section style={{position:'relative',borderBottom:'1px solid var(--rule)',overflow:'hidden'}}>
      <div className="container resp-hero" style={{paddingTop:56,paddingBottom:64,display:'grid',gridTemplateColumns:'1.1fr 1fr',gap:56,alignItems:'end'}}>
        <div>
          <div className="eyebrow" style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>
            <span>FILE · MAAMAKIM-01</span>
            <span style={{width:20,height:1,background:'var(--rule-strong)'}}/>
            <span>REV 04.2026</span>
            <span style={{width:20,height:1,background:'var(--rule-strong)'}}/>
            <span>FOR · ISRAELI VC & SOVEREIGN LPs</span>
          </div>
          <h1 style={{fontSize:96,lineHeight:.94,letterSpacing:'-0.03em',margin:'28px 0 0',fontWeight:600}}>
            Compute<br/>
            <span className="serif" style={{fontStyle:'italic',fontWeight:400}}>below</span> the<br/>
            surface.
          </h1>
          <p style={{fontSize:19,lineHeight:1.45,color:'var(--ink-2)',maxWidth:560,marginTop:28}}>
            Maamakim is building sovereign, seabed-anchored datacenter pods off the Israeli coast —
            nation-only AI and robotic compute, hardened by 600&nbsp;meters of Mediterranean water and
            cooled for free. Capex-efficient. Electromagnetically quiet. Kinetically defensible.
          </p>
          <div className="resp-hero-btns" style={{display:'flex',gap:12,marginTop:34,flexWrap:'wrap'}}>
            <a className="btn signal" href="#round">Open the round · $100M Series A <span className="arr"/></a>
            <a className="btn ghost" href="#architecture">Read the thesis</a>
          </div>
          <div className="resp-hero-stats" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:0,marginTop:56,borderTop:'1px solid var(--rule)'}}>
            {[
              ['42 MW','per-pod IT load, submerged'],
              ['1.03','design PUE · free seawater loop'],
              ['0','freshwater · zero land footprint'],
              ['<4 ms','to Tel Aviv core · dark fibre'],
            ].map(([k,v])=>(
              <div key={k} style={{padding:'18px 18px 18px 0',borderRight:'1px solid var(--rule)'}}>
                <div style={{fontSize:30,letterSpacing:'-0.02em',fontWeight:600}}>{k}</div>
                <div className="mono" style={{fontSize:11,color:'var(--ink-3)',marginTop:6}}>{v}</div>
              </div>
            ))}
          </div>
        </div>

        {/* right: live telemetry card */}
        <div className="resp-telemetry" style={{border:'1px solid var(--rule)',background:'var(--paper-2)',padding:0,position:'relative',minHeight:560}}>
          <div style={{display:'flex',justifyContent:'space-between',borderBottom:'1px solid var(--rule)',padding:'12px 16px'}}>
            <span className="mono" style={{fontSize:11}}>POD 01 · HAIFA-A · TEST ARTICLE</span>
            <span className="mono" style={{fontSize:11,color:'var(--ink-3)'}}><span className="dot ok"/> NOMINAL</span>
          </div>
          <BathymetryMap coords={coords}/>
          <div style={{borderTop:'1px solid var(--rule)',display:'grid',gridTemplateColumns:'repeat(3,1fr)'}}>
            {[
              ['LAT', coords.lat.toFixed(4)+'° N'],
              ['LNG', coords.lng.toFixed(4)+'° E'],
              ['DEPTH', coords.depth+' m'],
            ].map(([k,v])=>(
              <div key={k} style={{padding:'12px 14px',borderRight:'1px solid var(--rule)'}}>
                <div className="mono" style={{fontSize:10,color:'var(--ink-3)'}}>{k}</div>
                <div className="mono" style={{fontSize:14,marginTop:2}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{borderTop:'1px solid var(--rule)',padding:'12px 16px',display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
            {[['SEAFLOOR T°','13.4'],['INLET T°','14.1'],['IT ΔT','8.7'],['SALINITY','38.9']].map(([k,v])=>(
              <div key={k}>
                <div className="mono" style={{fontSize:10,color:'var(--ink-3)'}}>{k}</div>
                <div className="mono" style={{fontSize:13}}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function BathymetryMap({coords}){
  // stylised contour map of Haifa shelf
  return (
    <div style={{position:'relative',height:360,overflow:'hidden'}}>
      <svg viewBox="0 0 600 360" style={{width:'100%',height:'100%',display:'block'}}>
        <defs>
          <pattern id="hair" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M0 6 L6 0" stroke="oklch(0.85 0.01 240)" strokeWidth="0.5"/>
          </pattern>
        </defs>
        <rect width="600" height="360" fill="var(--paper)"/>
        {/* coastline */}
        <path d="M0 0 L0 360 L120 360 Q150 300 160 260 Q170 200 200 170 Q230 140 240 90 Q245 40 280 0 Z" fill="url(#hair)" stroke="var(--ink)" strokeWidth="1"/>
        {/* contour lines */}
        {[...Array(9)].map((_,i)=>(
          <path key={i}
            d={`M${300+i*14} 360 Q ${320+i*14} ${260-i*8} ${360+i*20} ${180-i*6} T ${520+i*10} ${40-i*4}`}
            fill="none" stroke="var(--rule-strong)" strokeWidth="0.6" strokeDasharray={i%3?'':'2 3'}/>
        ))}
        {/* dark fibre */}
        <path d="M0 120 Q 150 140 260 170 L 410 230" stroke="var(--ink)" strokeWidth="1.2" strokeDasharray="4 3" fill="none"/>
        <text x="10" y="114" className="mono" fontFamily="JetBrains Mono" fontSize="9" fill="var(--ink-3)">DARK FIBRE · HAIFA LANDING</text>
        {/* pod */}
        <g transform="translate(410,230)">
          <circle r="22" fill="none" stroke="var(--signal)" strokeWidth="0.8" opacity=".4"/>
          <circle r="40" fill="none" stroke="var(--signal)" strokeWidth="0.6" opacity=".2"/>
          <rect x="-7" y="-7" width="14" height="14" fill="var(--signal)"/>
          <line x1="7" y1="-7" x2="30" y2="-30" stroke="var(--ink)" strokeWidth="0.6"/>
          <text x="32" y="-32" className="mono" fontFamily="JetBrains Mono" fontSize="9" fill="var(--ink)">POD-01 · 42 MW</text>
        </g>
        {/* other pods */}
        <g transform="translate(490,170)" opacity=".5">
          <rect x="-5" y="-5" width="10" height="10" fill="none" stroke="var(--ink)"/>
          <text x="10" y="4" fontFamily="JetBrains Mono" fontSize="8" fill="var(--ink-3)">POD-02 · PLANNED</text>
        </g>
        <g transform="translate(360,290)" opacity=".5">
          <rect x="-5" y="-5" width="10" height="10" fill="none" stroke="var(--ink)"/>
          <text x="10" y="4" fontFamily="JetBrains Mono" fontSize="8" fill="var(--ink-3)">POD-03 · PLANNED</text>
        </g>
        {/* depth labels */}
        <text x="340" y="355" fontFamily="JetBrains Mono" fontSize="8" fill="var(--ink-3)">-200m</text>
        <text x="430" y="355" fontFamily="JetBrains Mono" fontSize="8" fill="var(--ink-3)">-600m</text>
        <text x="530" y="355" fontFamily="JetBrains Mono" fontSize="8" fill="var(--ink-3)">-1200m</text>
        {/* crosshair */}
        <g stroke="var(--ink)" strokeWidth="0.5">
          <line x1="410" y1="0" x2="410" y2="360" strokeDasharray="1 4" opacity=".4"/>
          <line x1="0" y1="230" x2="600" y2="230" strokeDasharray="1 4" opacity=".4"/>
        </g>
      </svg>
    </div>
  );
}

/* ============== TICKER ============== */
function Ticker(){
  const items=[
    'EU AI ACT · EXTRATERRITORIAL SCOPE EXPANDING',
    'HYPERSCALER OUTAGE · US-EAST-1 · 47 MIN',
    'MOSSAD RFI · SOVEREIGN LLM INFRASTRUCTURE',
    'ISRAELI AI WORKLOAD GROWTH · 74% YOY',
    'MEDITERRANEAN CABLE LANDING · HAIFA CAPACITY +2x',
    'NVIDIA EXPORT CONTROL · TIER-2 TIGHTENING',
  ];
  return (
    <div style={{background:'var(--abyss)',color:'var(--paper)',overflow:'hidden',borderBottom:'1px solid var(--ink)'}}>
      <div style={{display:'flex',gap:48,padding:'10px 0',whiteSpace:'nowrap',animation:'tkr 60s linear infinite'}} className="mono">
        {[...items,...items,...items].map((t,i)=>(
          <span key={i} style={{fontSize:11,letterSpacing:'.12em'}}>
            <span style={{color:'var(--signal)'}}>●</span>&nbsp;&nbsp;{t}
          </span>
        ))}
      </div>
      <style>{`@keyframes tkr{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}`}</style>
    </div>
  );

/* ============== APP ============== */
function App(){
  const [tweakOpen,setTweakOpen]=useState(false);
  const [state,setStateRaw]=useState(TWEAK_DEFAULS);
  const setState = (patch)=>{
    const next={...state,...patch};
    setStateRaw(next);
    try{window.parent.postMessage({type:'__edit_mode_set_keys',edits:patch},'*');}catch(e){}
  };
  useEffect(()=>{
    const onMsg=(e)=>{
      if(!e.data) return;
      if(e.data.type==='__activate_edit_mode') setTweakOpen(true);
      if(e.data.type==='__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message',onMsg);
    try{window.parent.postMessage({type:'__edit_mode_available'},'*');}catch(e){}
    return ()=>window.removeEventListener('message',onMsg);
  },[]);
  // apply accent
  useEffect(()=>{
    document.documentElement.style.setProperty('--signal', state.accent);
  },[state.accent]);
  // density
  useEffect(()=>{
    document.documentElement.style.setProperty('--density', state.density);
    document.body.style.fontSize = state.density==='dense' ? '14px':'15px';
  },[state.density]);
  return (
    <>
      <Nav/>
      <Ticker/>
      <Hero/>
      <Thesis/>
      <Architecture/>
      <ThreatModel/>
      <Economics/>
      <Timeline/>
      <Team/>
      <Backers/>
      <Round/>
      <Footer/>
      <Tweaks visible={tweakOpen} state={state} setState={setState}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
